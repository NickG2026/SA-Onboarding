apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-pdb1
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  labels:
    app: nginx-pdb1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-pdb1
  template:
    metadata:
      labels:
        app: nginx-pdb1
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
